
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAGA Workout</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #090909;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  margin-bottom: 25px;
}

header h1 {
  font-size: 35px;
  letter-spacing: 5px;
  margin: 0;
}

header p {
  color: #888;
  font-size: 11px;
  letter-spacing: 3px;
}

.section-title {
  color: #aaa;
  font-size: 11px;
  letter-spacing: 2px;
  margin: 30px 0 12px;
}

.panel {
  background: #171717;
  padding: 17px;
  border-radius: 12px;
  margin-bottom: 18px;
}

/* CRONÔMETRO */

.timer {
  font-size: 38px;
  text-align: center;
  font-weight: bold;
  letter-spacing: 2px;
  margin: 12px 0 18px;
}

.timer-buttons {
  display: flex;
  gap: 8px;
}

button {
  background: #eee;
  color: #111;
  border: none;
  padding: 13px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.timer-buttons button {
  flex: 1;
}

button.secondary {
  background: #303030;
  color: white;
}

/* CALENDÁRIO ANUAL */

.calendar-year {
  margin-bottom: 35px;
}

.year-title {
  font-size: 26px;
  letter-spacing: 3px;
  font-weight: bold;
  margin: 25px 0 15px;
}

.calendar-legend {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  color: #aaa;
  font-size: 11px;
  margin: 15px 0 20px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.legend-circle {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: #414141;
}

.legend-circle.green {
  background: #20b85a;
}

.months-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.month {
  background: #171717;
  border: 1px solid #292929;
  border-radius: 12px;
  padding: 10px 6px;
  min-width: 0;
}

.month-title {
  text-align: center;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1px;
  margin-bottom: 12px;
  text-transform: uppercase;
}

.weekdays,
.month-days {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 3px;
  text-align: center;
}

.weekdays span {
  color: #999;
  font-size: 8px;
  font-weight: bold;
  padding-bottom: 7px;
}

.calendar-day {
  width: 100%;
  min-width: 0;
  aspect-ratio: 1;
  padding: 0;
  margin: 0;
  border-radius: 50%;
  background: #414141;
  color: white;
  font-size: 10px;
  border: 1px solid #505050;
}

.calendar-day.done {
  background: #20b85a;
  border-color: #20b85a;
  color: #061b0d;
  font-weight: bold;
}

.calendar-empty {
  visibility: hidden;
  aspect-ratio: 1;
}

/* EXERCÍCIOS */

.exercise {
  display: flex;
  gap: 12px;
  background: #171717;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 15px;
  align-items: center;
}

.photo {
  width: 105px;
  height: 105px;
  flex-shrink: 0;
  background: #292929;
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #888;
  font-size: 11px;
  text-align: center;
  cursor: pointer;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.info {
  flex: 1;
  min-width: 0;
}

.name {
  width: 100%;
  background: transparent;
  border: none;
  color: white;
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 12px;
  outline: none;
}

.fields {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
}

.field {
  background: #292929;
  padding: 8px 3px;
  border-radius: 6px;
  text-align: center;
  min-width: 0;
}

.field label {
  display: block;
  color: #999;
  font-size: 9px;
  margin-bottom: 5px;
}

.field input {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  text-align: center;
  font-size: 17px;
  font-weight: bold;
}

.add-button {
  width: 100%;
  margin-top: 8px;
}

@media(max-width: 360px) {
  body {
    padding: 12px;
  }

  .photo {
    width: 85px;
    height: 85px;
  }

  .timer {
    font-size: 32px;
  }

  .month {
    padding: 8px 4px;
  }

  .weekdays span {
    font-size: 7px;
  }

  .calendar-day {
    font-size: 9px;
  }
}
</style>
</head>

<body>

<header>
  <h1>SAGA</h1>
  <p>WORKOUT SYSTEM</p>
</header>

<!-- CRONÔMETRO -->

<div class="section-title">TEMPO DE TREINO</div>

<div class="panel">
  <div class="timer" id="timer">00:00:00</div>

  <div class="timer-buttons">
    <button onclick="startTimer()">INICIAR</button>
    <button class="secondary" onclick="pauseTimer()">PAUSAR</button>
    <button class="secondary" onclick="resetTimer()">ZERAR</button>
  </div>
</div>

<!-- CALENDÁRIO ANUAL -->

<div class="section-title">MEU HISTÓRICO DE TREINOS</div>

<div class="calendar-legend">
  <div class="legend-item">
    <span class="legend-circle"></span>
    NÃO TREINOU
  </div>

  <div class="legend-item">
    <span class="legend-circle green"></span>
    TREINO CONFIRMADO
  </div>
</div>

<div id="calendar-2026" class="calendar-year">
  <div class="year-title">2026</div>
  <div class="months-grid" id="months-2026"></div>
</div>

<div id="calendar-2027" class="calendar-year">
  <div class="year-title">2027</div>
  <div class="months-grid" id="months-2027"></div>
</div>

<!-- EXERCÍCIOS -->

<div class="section-title">MEUS EXERCÍCIOS</div>

<div id="exercises"></div>

<button class="add-button" onclick="addExercise()">
  + ADICIONAR EXERCÍCIO
</button>

<script>

/* ARMAZENAMENTO */

function getData(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  } catch (error) {
    return fallback;
  }
}

let exercises = getData("saga", []);

/* PRESERVA AS MARCAÇÕES DA SEMANA ANTIGA */

let workoutDays = getData("sagaDays", []);

/* CRONÔMETRO */

let timerData = getData("sagaTimer", {
  elapsed: 0,
  startedAt: null
});

function save() {
  localStorage.setItem("saga", JSON.stringify(exercises));
}

/* CRONÔMETRO */

function getElapsed() {
  return timerData.elapsed +
    (timerData.startedAt
      ? Math.floor((Date.now() - timerData.startedAt) / 1000)
      : 0);
}

function updateTimer() {
  const seconds = getElapsed();

  const h = String(
    Math.floor(seconds / 3600)
  ).padStart(2, "0");

  const m = String(
    Math.floor((seconds % 3600) / 60)
  ).padStart(2, "0");

  const s = String(
    seconds % 60
  ).padStart(2, "0");

  document.getElementById("timer").textContent =
    `${h}:${m}:${s}`;

  localStorage.setItem(
    "sagaTimer",
    JSON.stringify(timerData)
  );
}

function startTimer() {
  if (!timerData.startedAt) {
    timerData.startedAt = Date.now();
    updateTimer();
  }
}

function pauseTimer() {
  if (timerData.startedAt) {
    timerData.elapsed = getElapsed();
    timerData.startedAt = null;
    updateTimer();
  }
}

function resetTimer() {
  if (confirm("Deseja zerar o cronômetro?")) {
    timerData = {
      elapsed: 0,
      startedAt: null
    };

    updateTimer();
  }
}

setInterval(updateTimer, 1000);
updateTimer();

/* CALENDÁRIO 2026 E 2027 */

const monthNames = [
  "Janeiro", "Fevereiro", "Março",
  "Abril", "Maio", "Junho",
  "Julho", "Agosto", "Setembro",
  "Outubro", "Novembro", "Dezembro"
];

const weekdayNames = [
  "SEG", "TER", "QUA", "QUI",
  "SEX", "SÁB", "DOM"
];

function dateKey(year, month, day) {
  return (
    year + "-" +
    String(month + 1).padStart(2, "0") + "-" +
    String(day).padStart(2, "0")
  );
}

function saveDays() {
  localStorage.setItem(
    "sagaDays",
    JSON.stringify(workoutDays)
  );
}

function renderYear(year) {
  const container = document.getElementById(
    "months-" + year
  );

  container.innerHTML = "";

  for (let month = 0; month < 12; month++) {

    const card = document.createElement("div");
    card.className = "month";

    const title = document.createElement("div");
    title.className = "month-title";
    title.textContent = monthNames[month];

    card.appendChild(title);

    /* NOMES DOS DIAS DA SEMANA */

    const weekdays = document.createElement("div");
    weekdays.className = "weekdays";

    weekdayNames.forEach(name => {
      const span = document.createElement("span");
      span.textContent = name;
      weekdays.appendChild(span);
    });

    card.appendChild(weekdays);

    /* DIAS DO MÊS */

    const daysContainer = document.createElement("div");
    daysContainer.className = "month-days";

    const firstDay = new Date(
      year, month, 1
    ).getDay();

    /* AJUSTA PARA SEGUNDA-FEIRA SER O PRIMEIRO DIA */

    const offset = (firstDay + 6) % 7;

    const totalDays = new Date(
      year, month + 1, 0
    ).getDate();

    /* ESPAÇOS ANTES DO PRIMEIRO DIA */

    for (let i = 0; i < offset; i++) {
      const empty = document.createElement("span");
      empty.className = "calendar-empty";
      daysContainer.appendChild(empty);
    }

    /* CRIA CADA DIA */

    for (let day = 1; day <= totalDays; day++) {

      const key = dateKey(year, month, day);

      const button = document.createElement("button");
      button.type = "button";
      button.className = "calendar-day";
      button.textContent = day;

      button.setAttribute(
        "aria-label",
        day + " de " + monthNames[month] + " de " + year
      );

      /* VERIFICA SE O TREINO FOI CONFIRMADO */

      if (workoutDays.includes(key)) {
        button.classList.add("done");
      }

      button.setAttribute(
        "aria-pressed",
        workoutDays.includes(key) ? "true" : "false"
      );

      /* TOCAR PARA MARCAR OU DESMARCAR */

      button.addEventListener("click", function() {

        if (workoutDays.includes(key)) {

          workoutDays = workoutDays.filter(
            date => date !== key
          );

          button.classList.remove("done");

        } else {

          workoutDays.push(key);
          button.classList.add("done");

        }

        button.setAttribute(
          "aria-pressed",
          workoutDays.includes(key) ? "true" : "false"
        );

        saveDays();

      });

      daysContainer.appendChild(button);
    }

    card.appendChild(daysContainer);
    container.appendChild(card);
  }
}

renderYear(2026);
renderYear(2027);

/* EXERCÍCIOS */

function render() {

  const container = document.getElementById("exercises");
  container.innerHTML = "";

  exercises.forEach((ex, index) => {

    const card = document.createElement("div");
    card.className = "exercise";

    /* FOTO */

    const photo = document.createElement("label");
    photo.className = "photo";

    if (ex.image) {

      const img = document.createElement("img");
      img.src = ex.image;
      photo.appendChild(img);

    } else {

      photo.textContent = "ADICIONAR FOTO";

    }

    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = "image/*";
    fileInput.hidden = true;

    fileInput.onchange = e => {

      const file = e.target.files[0];

      if (!file) return;

      if (file.size > 3 * 1024 * 1024) {
        alert("Escolha uma foto de até 3 MB.");
        return;
      }

      const reader = new FileReader();

      reader.onload = () => {
        ex.image = reader.result;
        save();
        render();
      };

      reader.readAsDataURL(file);
    };

    photo.appendChild(fileInput);

    /* INFORMAÇÕES */

    const info = document.createElement("div");
    info.className = "info";

    const name = document.createElement("input");
    name.className = "name";
    name.placeholder = "Nome do exercício";
    name.value = ex.name || "";

    name.oninput = e => {
      ex.name = e.target.value;
      save();
    };

    /* SÉRIES, REPETIÇÕES E PESO */

    const fields = document.createElement("div");
    fields.className = "fields";

    [
      ["SÉRIES", "series"],
      ["REPS", "reps"],
      ["PESO KG", "weight"]
    ].forEach(([label, key]) => {

      const field = document.createElement("div");
      field.className = "field";

      const title = document.createElement("label");
      title.textContent = label;

      const input = document.createElement("input");
      input.type = "number";
      input.min = "0";
      input.step = key === "weight" ? "0.5" : "1";
      input.value = ex[key] ?? 0;

      input.oninput = e => {
        ex[key] = e.target.value;
        save();
      };

      field.append(title, input);
      fields.appendChild(field);

    });

    info.append(name, fields);
    card.append(photo, info);
    container.appendChild(card);

  });
}

/* ADICIONAR EXERCÍCIO */

function addExercise() {

  exercises.push({
    name: "",
    series: 3,
    reps: 8,
    weight: 0,
    image: ""
  });

  save();
  render();
}

render();

</script>

</body>
</html>
