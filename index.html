<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAGA Workout</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  padding: 20px;

  background: #090909;

  color: white;

  font-family: Arial, sans-serif;

}

header {

  margin-bottom: 30px;

}

header h1 {

  font-size: 35px;

  letter-spacing: 5px;

  margin: 0;

}

header p {

  color: #888;

  font-size: 11px;

  letter-spacing: 3px;

}

.exercise {

  display: flex;

  gap: 12px;

  background: #171717;

  padding: 12px;

  border-radius: 12px;

  margin-bottom: 15px;

  align-items: center;

}

.photo {

  width: 105px;

  height: 105px;

  flex-shrink: 0;

  background: #292929;

  border-radius: 8px;

  overflow: hidden;

  display: flex;

  align-items: center;

  justify-content: center;

  color: #888;

  font-size: 12px;

  text-align: center;

  cursor: pointer;

}

.photo img {

  width: 100%;

  height: 100%;

  object-fit: cover;

}

.info {

  flex: 1;

  min-width: 0;

}

.name {

  width: 100%;

  background: transparent;

  border: none;

  color: white;

  font-size: 16px;

  font-weight: bold;

  margin-bottom: 12px;

  outline: none;

}

.fields {

  display: grid;

  grid-template-columns: repeat(3, 1fr);

  gap: 5px;

}

.field {

  background: #292929;

  padding: 8px 3px;

  border-radius: 6px;

  text-align: center;

  min-width: 0;

}

.field label {

  display: block;

  color: #999;

  font-size: 9px;

  margin-bottom: 5px;

}

.field input {

  width: 100%;

  background: transparent;

  border: none;

  outline: none;

  color: white;

  text-align: center;

  font-size: 17px;

  font-weight: bold;

}

button {

  background: #eeeeee;

  color: black;

  border: none;

  padding: 14px;

  width: 100%;

  border-radius: 8px;

  font-weight: bold;

  margin-top: 10px;

  cursor: pointer;

}

</style>

</head>

<body>

<header>

  <h1>SAGA</h1>

  <p>WORKOUT SYSTEM</p>

</header>

<div id="exercises"></div>

<button onclick="addExercise()">+ ADICIONAR EXERCÍCIO</button>

<script>

let exercises = JSON.parse(localStorage.getItem("saga")) || [];

function save() {

  localStorage.setItem("saga", JSON.stringify(exercises));

}

function render() {

  const container = document.getElementById("exercises");

  container.innerHTML = "";

  exercises.forEach((ex, index) => {

    const card = document.createElement("div");

    card.className = "exercise";

    card.innerHTML = `

      <label class="photo">

        ${ex.image

          ? `<img src="${ex.image}">`

          : "ADICIONAR FOTO"}

        <input type="file" accept="image/*" hidden>

      </label>

      <div class="info">

        <input class="name" value="${escapeHTML(ex.name)}" placeholder="Nome do exercício">

        <div class="fields">

          <div class="field">

            <label>SÉRIES</label>

            <input type="number" min="0" value="${ex.series}">

          </div>

          <div class="field">

            <label>REPS</label>

            <input type="number" min="0" value="${ex.reps}">

          </div>

          <div class="field">

            <label>PESO KG</label>

            <input type="number" min="0" step="0.5" value="${ex.weight}">

          </div>

        </div>

      </div>

    `;

    const inputs = card.querySelectorAll("input");

    inputs[1].addEventListener("input", e => {

      ex.name = e.target.value;

      save();

    });

    [2, 3, 4].forEach((n, i) => {

      inputs[n].addEventListener("input", e => {

        ex[["series", "reps", "weight"][i]] = e.target.value;

        save();

      });

    });

    inputs[0].addEventListener("change", e => {

      const file = e.target.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = () => {

        ex.image = reader.result;

        save();

        render();

      };

      reader.readAsDataURL(file);

    });

    container.appendChild(card);

  });

}

function escapeHTML(value) {

  return String(value).replace(/[&<>"']/g, c => ({

    "&": "&amp;", "<": "&lt;", ">": "&gt;",

    '"': "&quot;", "'": "&#39;"

  })[c]);

}

function addExercise() {

  exercises.push({

    name: "",

    series: 3,

    reps: 8,

    weight: 0,

    image: ""

  });

  save();

  render();

}

render();

</script>

</body>

</html>
