
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>SAGA | Workout System</title>

  <style>
    /* =========================
       CONFIGURAÇÕES GERAIS
    ========================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080808;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      padding: 24px 16px 50px;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    /* =========================
       CABEÇALHO
    ========================= */
    header {
      margin-bottom: 30px;
    }

    .logo {
      font-size: 35px;
      font-weight: 900;
      letter-spacing: 5px;
    }

    .subtitle {
      color: #777;
      font-size: 10px;
      letter-spacing: 4px;
      margin-top: 5px;
    }

    .section-label {
      color: #777;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 13px;
    }

    /* =========================
       CALENDÁRIO
    ========================= */
    .calendar-section {
      margin-bottom: 27px;
    }

    .calendar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .month-title {
      font-size: 19px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .calendar-hint {
      color: #555;
      font-size: 9px;
      letter-spacing: 1px;
    }

    .calendar-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      padding-bottom: 8px;
    }

    .calendar-scroll::-webkit-scrollbar {
      display: none;
    }

    .week {
      flex: 0 0 100%;
      scroll-snap-align: start;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .day {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      color: #777;
      font-size: 10px;
    }

    .day-name {
      font-size: 9px;
      color: #666;
      font-weight: bold;
    }

    .day-number {
      width: 34px;
      height: 34px;
      border: 1px solid #292929;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 11px;
      color: #aaa;
      background: #111;
      transition: .2s;
    }

    .day.completed .day-number {
      background: #a8f05a;
      border-color: #a8f05a;
      color: #080808;
      font-weight: 900;
    }

    .day.outside {
      visibility: hidden;
    }

    .day:not(.outside) {
      cursor: pointer;
    }

    /* =========================
       CRONÔMETRO
    ========================= */
    .timer-section {
      background: #101010;
      border: 1px solid #222;
      border-radius: 14px;
      padding: 19px;
      margin-bottom: 35px;
    }

    .timer-display {
      font-size: 38px;
      font-weight: bold;
      letter-spacing: 3px;
      text-align: center;
      margin: 8px 0 17px;
      font-variant-numeric: tabular-nums;
    }

    .timer-buttons {
      display: flex;
      justify-content: center;
      gap: 9px;
    }

    .timer-button {
      background: #202020;
      color: white;
      border: 1px solid #333;
      border-radius: 7px;
      padding: 10px 18px;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .timer-button.primary {
      background: #a8f05a;
      border-color: #a8f05a;
      color: #080808;
    }

    /* =========================
       FICHAS DE TREINO
    ========================= */
    .workout-section {
      margin-bottom: 25px;
    }

    .workout-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 11px;
    }

    .workout-box {
      min-height: 115px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 17px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: left;
      color: white;
      transition: .2s;
    }

    .workout-box:active {
      transform: scale(.98);
      border-color: #a8f05a;
    }

    .workout-name {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .workout-count {
      color: #777;
      font-size: 10px;
      margin-top: 14px;
      letter-spacing: 1px;
    }

    .workout-arrow {
      color: #a8f05a;
      font-size: 18px;
      align-self: flex-end;
    }

    .workout-box:last-child {
      grid-column: 1 / -1;
      min-height: 90px;
    }

    /* =========================
       TELA INTERNA DA FICHA
    ========================= */
    .workout-detail {
      display: none;
      margin-top: 5px;
    }

    .workout-detail.active {
      display: block;
    }

    .workout-grid.hidden,
    .workout-section.hidden {
      display: none;
    }

    .back-button {
      background: transparent;
      color: #aaa;
      border: 1px solid #333;
      border-radius: 7px;
      padding: 10px 14px;
      font-size: 10px;
      letter-spacing: 1px;
      margin-bottom: 24px;
    }

    .detail-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    .detail-subtitle {
      color: #666;
      font-size: 10px;
      letter-spacing: 2px;
      margin-bottom: 22px;
    }

    /* =========================
       CARTÕES DE EXERCÍCIO
    ========================= */
    .exercise-list {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .exercise {
      background: #111;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 13px;
    }

    .exercise-main {
      display: flex;
      gap: 13px;
      align-items: flex-start;
    }

    .photo-area {
      width: 105px;
      height: 115px;
      flex-shrink: 0;
      background: #1c1c1c;
      border: 1px dashed #444;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .photo-area img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-placeholder {
      color: #777;
      font-size: 9px;
      text-align: center;
      line-height: 1.6;
      padding: 5px;
    }

    .photo-input {
      display: none;
    }

    .photo-button {
      display: block;
      background: #222;
      border: 1px solid #3a3a3a;
      color: #aaa;
      border-radius: 5px;
      padding: 7px 5px;
      margin-top: 7px;
      text-align: center;
      font-size: 8px;
      letter-spacing: .5px;
    }

    .exercise-info {
      flex: 1;
      min-width: 0;
    }

    .exercise-name {
      width: 100%;
      color: white;
      background: transparent;
      border: none;
      border-bottom: 1px solid #333;
      padding: 7px 0;
      font-size: 14px;
      font-weight: bold;
      outline: none;
    }

    .exercise-name:focus {
      border-color: #a8f05a;
    }

    .exercise-fields {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-top: 13px;
    }

    .field label {
      display: block;
      color: #777;
      font-size: 8px;
      letter-spacing: .5px;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      min-width: 0;
      background: #202020;
      border: 1px solid #333;
      border-radius: 5px;
      padding: 9px 4px;
      color: white;
      text-align: center;
      font-size: 12px;
      outline: none;
    }

    .field input:focus {
      border-color: #a8f05a;
    }

    .exercise-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .delete-exercise {
      background: transparent;
      color: #a66b6b;
      border: none;
      font-size: 9px;
      letter-spacing: 1px;
      padding: 5px;
    }

    .add-exercise-button {
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: #a8f05a;
      color: #080808;
      border: none;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .empty-message {
      color: #666;
      text-align: center;
      font-size: 11px;
      padding: 30px 10px;
      border: 1px dashed #292929;
      border-radius: 10px;
    }

    /* =========================
       RODAPÉ
    ========================= */
    footer {
      text-align: center;
      color: #444;
      font-size: 9px;
      letter-spacing: 3px;
      margin-top: 45px;
    }

    @media (max-width: 380px) {
      .day-number {
        width: 30px;
        height: 30px;
      }

      .photo-area {
        width: 88px;
        height: 105px;
      }

      .workout-name {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- CABEÇALHO -->
    <header>
      <div class="logo">SAGA</div>
      <div class="subtitle">WORKOUT SYSTEM</div>
    </header>

    <!-- CALENDÁRIO -->
    <section class="calendar-section">
      <div class="calendar-top">
        <div>
          <div class="section-label">CONSISTÊNCIA</div>
          <div class="month-title" id="monthTitle">NOVEMBRO 2026</div>
        </div>
        <div class="calendar-hint">DESLIZE →</div>
      </div>

      <div class="calendar-scroll" id="calendarScroll"></div>
    </section>

    <!-- CRONÔMETRO -->
    <section class="timer-section">
      <div class="section-label">TEMPO DE DESCANSO</div>
      <div class="timer-display" id="timerDisplay">00:00</div>

      <div class="timer-buttons">
        <button class="timer-button primary" id="timerStart">INICIAR</button>
        <button class="timer-button" id="timerReset">ZERAR</button>
      </div>
    </section>

    <!-- CINCO FICHAS FIXAS -->
    <section class="workout-section" id="workoutSection">
      <div class="section-label">MINHAS FICHAS</div>
      <div class="workout-grid" id="workoutGrid"></div>
    </section>

    <!-- DETALHES DO TREINO -->
    <section class="workout-detail" id="workoutDetail">
      <button class="back-button" onclick="closeWorkout()">← VOLTAR</button>

      <div class="detail-title" id="detailTitle">UPPER</div>
      <div class="detail-subtitle">EXERCÍCIOS DO TREINO</div>

      <div class="exercise-list" id="exerciseList"></div>

      <button class="add-exercise-button" onclick="addExercise()">
        + ADICIONAR EXERCÍCIO
      </button>
    </section>

    <footer>SAGA WORKOUT SYSTEM</footer>
  </div>

  <script>
    /* =========================
       FICHAS FIXAS E DADOS
    ========================= */

    const defaultWorkouts = [
      { id: "upper", name: "UPPER", exercises: [] },
      { id: "lower", name: "LOWER", exercises: [] },
      { id: "push", name: "PUSH", exercises: [] },
      { id: "pull", name: "PULL", exercises: [] },
      { id: "legs", name: "LEGS", exercises: [] }
    ];

    let workouts = loadWorkouts();
    let selectedWorkoutId = null;

    function loadWorkouts() {
      const saved = localStorage.getItem("sagaWorkouts");

      if (saved) {
        try {
          const parsed = JSON.parse(saved);

          // Mantém somente as cinco fichas oficiais.
          return defaultWorkouts.map(defaultWorkout => {
            const existing = parsed.find(item => item.id === defaultWorkout.id);

            return existing
              ? {
                  ...defaultWorkout,
                  exercises: Array.isArray(existing.exercises)
                    ? existing.exercises
                    : []
                }
              : defaultWorkout;
          });
        } catch (error) {
          console.error("Erro ao carregar fichas:", error);
        }
      }

      // Migração dos exercícios antigos para a ficha UPPER.
      const oldExercises = localStorage.getItem("saga");

      if (oldExercises) {
        try {
          const parsedOld = JSON.parse(oldExercises);

          if (Array.isArray(parsedOld)) {
            defaultWorkouts[0].exercises = parsedOld.map((exercise, index) => ({
              id: exercise.id || Date.now() + index,
              name: exercise.name || "",
              series: exercise.series || "",
              reps: exercise.reps || "",
              weight: exercise.weight || "",
              photo: exercise.photo || ""
            }));
          }
        } catch (error) {
          console.error("Erro ao migrar exercícios antigos:", error);
        }
      }

      return defaultWorkouts;
    }

    function saveWorkouts() {
      try {
        localStorage.setItem("sagaWorkouts", JSON.stringify(workouts));
      } catch (error) {
        alert("O armazenamento do navegador está cheio. Tente usar fotos menores.");
      }
    }

    function getSelectedWorkout() {
      return workouts.find(workout => workout.id === selectedWorkoutId);
    }

    /* =========================
       MOSTRAR AS CINCO FICHAS
    ========================= */

    function renderWorkouts() {
      const grid = document.getElementById("workoutGrid");
      grid.innerHTML = "";

      workouts.forEach(workout => {
        const box = document.createElement("button");
        box.className = "workout-box";
        box.type = "button";

        const name = document.createElement("div");
        name.className = "workout-name";
        name.textContent = workout.name;

        const count = document.createElement("div");
        count.className = "workout-count";
        count.textContent =
          workout.exercises.length +
          (workout.exercises.length === 1 ? " EXERCÍCIO" : " EXERCÍCIOS");

        const arrow = document.createElement("div");
        arrow.className = "workout-arrow";
        arrow.textContent = "↗";

        box.append(name, count, arrow);
        box.addEventListener("click", () => openWorkout(workout.id));

        grid.appendChild(box);
      });
    }

    /* =========================
       ABRIR E FECHAR UMA FICHA
    ========================= */

    function openWorkout(id) {
      selectedWorkoutId = id;

      const workout = getSelectedWorkout();
      if (!workout) return;

      document.getElementById("workoutSection").classList.add("hidden");
      document.getElementById("workoutDetail").classList.add("active");

      document.getElementById("detailTitle").textContent = workout.name;

      renderExercises();

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function closeWorkout() {
      selectedWorkoutId = null;

      document.getElementById("workoutDetail").classList.remove("active");
      document.getElementById("workoutSection").classList.remove("hidden");

      renderWorkouts();

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    /* =========================
       ADICIONAR EXERCÍCIOS
    ========================= */

    function addExercise() {
      const workout = getSelectedWorkout();
      if (!workout) return;

      workout.exercises.push({
        id: Date.now() + Math.random(),
        name: "",
        series: "",
        reps: "",
        weight: "",
        photo: ""
      });

      saveWorkouts();
      renderExercises();
    }

    /* =========================
       MOSTRAR EXERCÍCIOS
    ========================= */

    function renderExercises() {
      const workout = getSelectedWorkout();
      const list = document.getElementById("exerciseList");

      if (!workout) return;

      list.innerHTML = "";

      if (workout.exercises.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-message";
        empty.textContent = "AINDA NÃO HÁ EXERCÍCIOS NESTA FICHA.";
        list.appendChild(empty);
        return;
      }

      workout.exercises.forEach(exercise => {
        const card = document.createElement("article");
        card.className = "exercise";

        const main = document.createElement("div");
        main.className = "exercise-main";

        // Área da foto.
        const photoColumn = document.createElement("div");

        const photoArea = document.createElement("div");
        photoArea.className = "photo-area";

        if (exercise.photo) {
          const image = document.createElement("img");
          image.src = exercise.photo;
          image.alt = "Foto do exercício";
          photoArea.appendChild(image);
        } else {
          const placeholder = document.createElement("div");
          placeholder.className = "photo-placeholder";
          placeholder.textContent = "FOTO DO EXERCÍCIO";
          photoArea.appendChild(placeholder);
        }

        const photoInput = document.createElement("input");
        photoInput.type = "file";
        photoInput.accept = "image/*";
        photoInput.className = "photo-input";

        const photoButton = document.createElement("label");
        photoButton.className = "photo-button";
        photoButton.textContent = exercise.photo ? "TROCAR FOTO" : "+ ADICIONAR FOTO";

        photoButton.addEventListener("click", () => photoInput.click());

        photoInput.addEventListener("change", event => {
          const file = event.target.files[0];
          if (!file) return;

          if (!file.type.startsWith("image/")) {
            alert("Selecione um arquivo de imagem.");
            return;
          }

          // Reduz a imagem para economizar espaço no navegador.
          const reader = new FileReader();

          reader.onload = loadEvent => {
            const image = new Image();

            image.onload = () => {
              const canvas = document.createElement("canvas");
              const maxSize = 1000;

              let width = image.width;
              let height = image.height;

              if (width > height && width > maxSize) {
                height = Math.round(height * maxSize / width);
                width = maxSize;
              } else if (height > maxSize) {
                width = Math.round(width * maxSize / height);
                height = maxSize;
              }

              canvas.width = width;
              canvas.height = height;

              const context = canvas.getContext("2d");
              context.drawImage(image, 0, 0, width, height);

              exercise.photo = canvas.toDataURL("image/jpeg", 0.75);

              saveWorkouts();
              renderExercises();
            };

            image.src = loadEvent.target.result;
          };

          reader.readAsDataURL(file);
        });

        photoColumn.append(photoArea, photoInput, photoButton);

        // Informações e nome.
        const info = document.createElement("div");
        info.className = "exercise-info";

        const nameInput = document.createElement("input");
        nameInput.className = "exercise-name";
        nameInput.type = "text";
        nameInput.placeholder = "Nome do exercício";
        nameInput.value = exercise.name;

        nameInput.addEventListener("input", () => {
          exercise.name = nameInput.value;
          saveWorkouts();
        });

        const fields = document.createElement("div");
        fields.className = "exercise-fields";

        const fieldDefinitions = [
          { key: "series", label: "SÉRIES", placeholder: "4" },
          { key: "reps", label: "REPS", placeholder: "10" },
          { key: "weight", label: "CARGA", placeholder: "20kg" }
        ];

        fieldDefinitions.forEach(definition => {
          const field = document.createElement("div");
          field.className = "field";

          const label = document.createElement("label");
          label.textContent = definition.label;

          const input = document.createElement("input");
          input.type = "text";
          input.placeholder = definition.placeholder;
          input.value = exercise[definition.key] || "";

          input.addEventListener("input", () => {
            exercise[definition.key] = input.value;
            saveWorkouts();
          });

          field.append(label, input);
          fields.appendChild(field);
        });

        info.append(nameInput, fields);
        main.append(photoColumn, info);

        // Botão para excluir apenas o exercício.
        const footer = document.createElement("div");
        footer.className = "exercise-footer";

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-exercise";
        deleteButton.textContent = "EXCLUIR EXERCÍCIO";

        deleteButton.addEventListener("click", () => {
          deleteExercise(exercise.id);
        });

        footer.appendChild(deleteButton);
        card.append(main, footer);
        list.appendChild(card);
      });
    }

    /* =========================
       EXCLUIR UM EXERCÍCIO
    ========================= */

    function deleteExercise(exerciseId) {
      const workout = getSelectedWorkout();
      if (!workout) return;

      const confirmed = confirm("Deseja excluir este exercício?");
      if (!confirmed) return;

      workout.exercises = workout.exercises.filter(
        exercise => exercise.id !== exerciseId
      );

      saveWorkouts();
      renderExercises();
      renderWorkouts();
    }

    /* =========================
       CRONÔMETRO
    ========================= */

    const timerDisplay = document.getElementById("timerDisplay");
    const timerStartButton = document.getElementById("timerStart");
    const timerResetButton = document.getElementById("timerReset");

    let timerElapsed = 0;
    let timerRunning = false;
    let timerStartedAt = null;
    let timerInterval = null;

    function loadTimer() {
      try {
        const saved = JSON.parse(localStorage.getItem("sagaTimer"));

        if (!saved) return;

        timerElapsed = saved.elapsed || 0;
        timerRunning = saved.running || false;

        if (timerRunning && saved.startedAt) {
          timerStartedAt = saved.startedAt;
          timerElapsed += Math.floor((Date.now() - timerStartedAt) / 1000);
          timerStartedAt = Date.now();
        } else {
          timerRunning = false;
        }
      } catch (error) {
        timerElapsed = 0;
        timerRunning = false;
      }

      updateTimerDisplay();

      if (timerRunning) {
        startTimerInterval();
      }
    }

    function saveTimer() {
      localStorage.setItem("sagaTimer", JSON.stringify({
        elapsed: timerElapsed,
        running: timerRunning,
        startedAt: timerStartedAt
      }));
    }

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = seconds % 60;

      return String(minutes).padStart(2, "0") +
        ":" +
        String(remainingSeconds).padStart(2, "0");
    }

    function updateTimerDisplay() {
      let current = timerElapsed;

      if (timerRunning && timerStartedAt) {
        current += Math.floor((Date.now() - timerStartedAt) / 1000);
      }

      timerDisplay.textContent = formatTime(current);
    }

    function startTimerInterval() {
      clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        updateTimerDisplay();
        saveTimer();
      }, 500);
    }

    function startOrPauseTimer() {
      if (!timerRunning) {
        timerRunning = true;
        timerStartedAt = Date.now();
        timerStartButton.textContent = "PAUSAR";
        timerStartButton.classList.remove("primary");
        startTimerInterval();
      } else {
        timerElapsed += Math.floor((Date.now() - timerStartedAt) / 1000);
        timerRunning = false;
        timerStartedAt = null;
        clearInterval(timerInterval);
        timerStartButton.textContent = "INICIAR";
        timerStartButton.classList.add("primary");
      }

      updateTimerDisplay();
      saveTimer();
    }

    function resetTimer() {
      timerElapsed = 0;
      timerRunning = false;
      timerStartedAt = null;

      clearInterval(timerInterval);

      timerStartButton.textContent = "INICIAR";
      timerStartButton.classList.add("primary");

      updateTimerDisplay();
      saveTimer();
    }

    timerStartButton.addEventListener("click", startOrPauseTimer);
    timerResetButton.addEventListener("click", resetTimer);

    /* =========================
       CALENDÁRIO NOVEMBRO/DEZEMBRO 2026
    ========================= */

    const calendarScroll = document.getElementById("calendarScroll");
    const monthTitle = document.getElementById("monthTitle");

    const dayNames = ["SEG", "TER", "QUA", "QUI", "SEX", "SÁB", "DOM"];
    const monthNames = [
      "JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL",
      "MAIO", "JUNHO", "JULHO", "AGOSTO",
      "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"
    ];

    let completedDays = {};

    try {
      completedDays = JSON.parse(localStorage.getItem("sagaDays")) || {};
    } catch (error) {
      completedDays = {};
    }

    function dateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function renderCalendar() {
      calendarScroll.innerHTML = "";

      // Começa na segunda-feira da semana que contém 1º de novembro.
      const firstDate = new Date(2026, 9, 26);

      for (let weekIndex = 0; weekIndex < 10; weekIndex++) {
        const week = document.createElement("div");
        week.className = "week";

        const monday = new Date(firstDate);
        monday.setDate(firstDate.getDate() + weekIndex * 7);

        let visibleMonth = 10;

        for (let dayIndex = 0; dayIndex < 7; dayIndex++) {
          const date = new Date(monday);
          date.setDate(monday.getDate() + dayIndex);

          const day = document.createElement("div");
          day.className = "day";

          const isInPeriod =
            date >= new Date(2026, 10, 1) &&
            date <= new Date(2026, 11, 31);

          if (!isInPeriod) {
            day.classList.add("outside");
          } else {
            visibleMonth = date.getMonth();

            const key = dateKey(date);

            if (completedDays[key]) {
              day.classList.add("completed");
            }

            day.addEventListener("click", () => {
              completedDays[key] = !completedDays[key];

              if (!completedDays[key]) {
                delete completedDays[key];
              }

              localStorage.setItem(
                "sagaDays",
                JSON.stringify(completedDays)
              );

              renderCalendar();
            });
          }

          const name = document.createElement("div");
          name.className = "day-name";
          name.textContent = dayNames[dayIndex];

          const number = document.createElement("div");
          number.className = "day-number";
          number.textContent = date.getDate();

          day.append(name, number);
          week.appendChild(day);
        }

        week.dataset.month = visibleMonth;
        calendarScroll.appendChild(week);
      }

      updateCalendarMonth();
    }

    function updateCalendarMonth() {
      const weeks = [...calendarScroll.children];

      if (!weeks.length) return;

      const scrollCenter =
        calendarScroll.scrollLeft + calendarScroll.clientWidth / 2;

      let closestWeek = weeks[0];
      let closestDistance = Infinity;

      weeks.forEach(week => {
        const center = week.offsetLeft + week.offsetWidth / 2;
        const distance = Math.abs(center - scrollCenter);

        if (distance < closestDistance) {
          closestDistance = distance;
          closestWeek = week;
        }
      });

      const month = Number(closestWeek.dataset.month);
      monthTitle.textContent = `${monthNames[month]} 2026`;
    }

    calendarScroll.addEventListener("scroll", updateCalendarMonth);

    function goToCurrentWeek() {
      const today = new Date();

      if (today.getFullYear() !== 2026 ||
          today.getMonth() < 10 ||
          today.getMonth() > 11) {
        return;
      }

      const target = new Date(today);
      const dayOfWeek = (target.getDay() + 6) % 7;
      target.setDate(target.getDate() - dayOfWeek);

      const firstDate = new Date(2026, 9, 26);
      const weekIndex = Math.floor(
        (target - firstDate) / (7 * 24 * 60 * 60 * 1000)
      );

      const week = calendarScroll.children[weekIndex];

      if (week) {
        calendarScroll.scrollLeft = week.offsetLeft;
        updateCalendarMonth();
      }
    }

    /* =========================
       INICIALIZAÇÃO
    ========================= */

    renderWorkouts();
    renderCalendar();
    loadTimer();

    // Abre a semana atual quando a página carregar.
    setTimeout(goToCurrentWeek, 100);
  </script>
</body>
</html>
